name: Bug report
description: 报告可复现的部署、连接或对话问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除 QQ 号、Token、私人消息、用户名和本机私人路径。安全问题请使用 Private Vulnerability Reporting，不要提交公开 Issue。
  - type: input
    id: version
    attributes:
      label: 项目版本或 commit
      placeholder: v0.1.0 / abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows、QQ、NapCat 和 Codex 版本
      placeholder: Windows 11; NapCat ...; Codex ...
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 问题发生在哪一层
      options:
        - 初始化或 doctor
        - QQ / NapCat 登录
        - OneBot WebSocket
        - Codex app-server
        - 文本回复
        - 图片或 GIF
        - 主动消息或天气
        - 自启动或守护进程
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最短复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏后的诊断与日志
      description: 粘贴 qq-codex-doctor 结果和最相关的少量日志。不要粘贴 Token 或私人聊天全文。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经删除 QQ 号、Token、私人消息和本机私人路径。
          required: true
