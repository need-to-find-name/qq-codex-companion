name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: latest-known
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build distributions and release ZIP
        shell: pwsh
        run: |
          uv build
          ./scripts/build-release.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qq-codex-companion-windows
          path: |
            dist/*-windows.zip
            dist/*-windows.zip.sha256
          if-no-files-found: error

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $text = Get-Content -Raw pyproject.toml
          $version = [regex]::Match($text, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
              throw "Tag ${{ github.ref_name }} does not match project version v$version"
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
              Get-ChildItem -Path dist -File |
                  Where-Object { $_.Name -like '*-windows.zip' -or $_.Name -like '*-windows.zip.sha256' } |
                  ForEach-Object { $_.FullName }
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $assets --clobber
          } else {
              gh release create $tag $assets --verify-tag --generate-notes --title "QQ Codex Companion $tag"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
